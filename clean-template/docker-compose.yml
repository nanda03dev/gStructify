version: "3.9"

services:
  mongo:
    image: mongo:latest
    container_name: mongo_container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: gtest
      POSTGRES_PASSWORD: gtest
      POSTGRES_DB: primary-db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  template-ms:
    depends_on:
      - postgres
      - mongo
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: template-ms
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - FIBER_ENV=development
      - SQL_DB_URI=postgres://gtest:gtest@postgres:5432/primary-db?sslmode=disable
    command: [ "air", "-c", ".air.toml" ]
    networks:
      - app-network

volumes:
  postgres-data:
  mongo-data:


networks:
  app-network:
    driver: bridge
